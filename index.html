<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c2422">
  <meta name="description" content="雅曼妮-SPA 官方網站入口，網站建置中。">
  <title>雅曼妮-SPA｜官方入口</title>
  <style>
    :root { color-scheme: dark; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; color: #f4f0e8; background: #1c2422; display: grid; place-items: center; overflow: hidden; }
    body::before { content: ""; position: fixed; inset: -30%; pointer-events: none; background: radial-gradient(circle at 24% 30%, #476356 0, transparent 37%), radial-gradient(circle at 78% 75%, #6c5947 0, transparent 34%); opacity: .45; }
    body::after { content: ""; position: fixed; inset: 20px; border: 1px solid #d0bea665; pointer-events: none; }
    main { position: relative; width: min(620px, calc(100% - 64px)); text-align: center; padding: 80px 16px; }
    .mark { display: inline-grid; place-items: center; width: 64px; height: 64px; border: 1px solid #d7c4aa; border-radius: 50%; color: #dcc6aa; font-family: Georgia, serif; font-size: 31px; margin-bottom: 42px; }
    .eyebrow { margin: 0 0 12px; color: #d3bfa5; font: 500 12px/1.5 Georgia, serif; letter-spacing: .38em; }
    h1 { margin: 0; font-size: clamp(40px, 9vw, 74px); font-weight: 500; letter-spacing: .12em; line-height: 1.3; }
    .rule { display: block; width: 50px; height: 1px; background: #d8c5aa; margin: 37px auto; }
    .message { margin: 0; color: #e1ded5; font-size: clamp(16px, 3vw, 19px); letter-spacing: .12em; line-height: 1.8; }
    .detail { margin: 13px 0 0; color: #bcbcb2; font-size: 14px; line-height: 1.8; }
    footer { position: fixed; bottom: 49px; width: 100%; text-align: center; color: #aeb7ae; font: 11px/1.4 Georgia, serif; letter-spacing: .2em; }
    @media (max-width: 520px) { body::after { inset: 12px; } main { width: calc(100% - 48px); padding: 60px 0; } .mark { margin-bottom: 32px; } footer { bottom: 30px; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">A</div>
    <p class="eyebrow">AMANI SPA</p>
    <h1>雅曼妮-SPA</h1>
    <span class="rule" aria-hidden="true"></span>
    <p class="message">官方網站準備中</p>
    <p class="detail">服務資訊與預約入口即將開放，敬請期待。</p>
  </main>
  <footer>AMANI SPA · OFFICIAL ENTRY</footer>
  <!-- V.2166：雅曼妮官方入口暫不導向尚未上線的分流或客用頁。 -->
</body>
</html>
